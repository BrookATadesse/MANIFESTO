<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a new kind of meaning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #ff4d2e;
      color: #111;
      font-family: "IBM Plex Mono", monospace;
      overflow: hidden;
    }

    .page { padding: 2rem; }

    .src {
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .junk {
      margin-top: 1rem;
      font-size: 4vw;
      line-height: 0.9;
      color: #7a1408;
      word-break: break-word;
    }

    h1 {
      margin: 0.2rem 0 0;
      font-family: Anton, Impact, sans-serif;
      font-size: 18vw;
      line-height: 0.8;
      color: #fff4a3;
      letter-spacing: -0.03em;
    }

    h1 span {
      display: inline-block;
      cursor: pointer;
    }

    h1 span:hover {
      color: #111;
      transform: scale(1.12) rotate(-6deg);
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="src">First Things First 2000</p>

    <div class="junk" id="junk">
      dog biscuits designer coffee diamonds detergents hair gel cigarettes credit cards sneakers
    </div>

    <h1 id="word">meaning</h1>
  </div>

  <script>
    const word = document.getElementById("word");
    const letters = word.innerText.split("");
    word.innerHTML = letters.map(function (letter) {
      return "<span>" + letter + "</span>";
    }).join("");

    const junk = document.getElementById("junk");
    const original = junk.innerText;

    document.body.onclick = function () {
      if (junk.dataset.mode === "on") {
        junk.innerText = original;
        junk.dataset.mode = "off";
        document.body.style.background = "#ff4d2e";
        junk.style.color = "#7a1408";
      } else {
        junk.innerText = "a new kind of meaning a new kind of meaning a new kind of meaning";
        junk.dataset.mode = "on";
        document.body.style.background = "#111";
        junk.style.color = "#fff4a3";
      }
    };
  </script>
</body>
</html>
